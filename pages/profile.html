<!DOCTYPE html>
<html lang="ru" class="is-preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Pascal Vent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <script src="../js/common/preloader.js"></script>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>
<body data-page="profile">

  
  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <img class="preloader__logo" src="../assets/icons/logo.svg" alt="Pascal Vent" width="196" height="61">
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>


  <div id="header" data-header></div>

  <main>
    <section class="account-page" aria-labelledby="profile-title">
      <div class="account-page__inner">
        <nav class="account-page__breadcrumbs" aria-label="Хлебные крошки">
          <a href="../index.html" data-i18n="category.home">Главная</a>
          <span aria-hidden="true">/</span>
          <span data-i18n="profile.title">Профиль</span>
        </nav>

        <h1 class="account-page__title" id="profile-title" data-i18n="profile.title">Профиль</h1>

        <div class="profile-layout">
          <section class="profile-hero" aria-labelledby="profile-name">
            <div class="profile-hero__top">
              <div class="profile-hero__avatar" id="profile-avatar" aria-hidden="true">—</div>
              <div class="profile-hero__intro">
                <p class="profile-hero__eyebrow" data-i18n="profile.personalCabinet">Личный кабинет</p>
                <h2 class="profile-hero__name" id="profile-name">—</h2>
                <span class="profile-hero__role" id="profile-role">—</span>
              </div>
            </div>

            <ul class="profile-hero__meta">
              <li class="profile-hero__meta-item">
                <span class="profile-hero__meta-label" data-i18n="profile.nickname">Никнейм</span>
                <span class="profile-hero__meta-value" id="profile-nickname">—</span>
              </li>
              <li class="profile-hero__meta-item">
                <span class="profile-hero__meta-label" data-i18n="auth.register.email">Email</span>
                <span class="profile-hero__meta-value" id="profile-email">—</span>
              </li>
              <li class="profile-hero__meta-item">
                <span class="profile-hero__meta-label" data-i18n="auth.register.phone">Телефон</span>
                <span class="profile-hero__meta-value" id="profile-phone">—</span>
              </li>
            </ul>
          </section>

          <div class="profile-tabs">
            <div class="profile-tabs__nav" role="tablist" aria-label="Разделы профиля">
              <button
                class="profile-tabs__btn profile-tabs__btn--active"
                type="button"
                role="tab"
                id="profile-tab-orders"
                aria-selected="true"
                aria-controls="profile-panel-orders"
                data-profile-tab="orders"
              >
                <span data-i18n="profile.ordersTitle">История заказов</span>
                <span class="profile-tabs__count" id="profile-orders-count" hidden>0</span>
              </button>
              <button
                class="profile-tabs__btn"
                type="button"
                role="tab"
                id="profile-tab-settings"
                aria-selected="false"
                aria-controls="profile-panel-settings"
                data-profile-tab="settings"
                tabindex="-1"
              >
                <span data-i18n="profile.settingsTitle">Настройки</span>
              </button>
            </div>

            <div class="profile-tabs__panels">
              <section
                class="profile-panel profile-panel--orders"
                id="profile-panel-orders"
                role="tabpanel"
                aria-labelledby="profile-tab-orders"
                data-profile-panel="orders"
              >
                <p class="profile-panel__empty" id="orders-empty" data-i18n="profile.ordersEmpty">Заказов пока нет</p>
                <div class="profile-orders" id="orders-list" hidden></div>
              </section>

              <section
                class="profile-panel profile-panel--settings"
                id="profile-panel-settings"
                role="tabpanel"
                aria-labelledby="profile-tab-settings"
                data-profile-panel="settings"
                hidden
              >
                <form class="profile-settings" id="profile-settings-form" novalidate>
                  <div class="profile-settings__grid">
                    <label class="profile-settings__field">
                      <span class="profile-settings__label" data-i18n="auth.register.firstName">Имя</span>
                      <input class="profile-settings__input" name="firstName" required>
                    </label>
                    <label class="profile-settings__field">
                      <span class="profile-settings__label" data-i18n="auth.register.lastName">Фамилия</span>
                      <input class="profile-settings__input" name="lastName" required>
                    </label>
                    <label class="profile-settings__field">
                      <span class="profile-settings__label" data-i18n="auth.register.email">Email</span>
                      <input class="profile-settings__input" name="email" type="email" required>
                    </label>
                    <label class="profile-settings__field">
                      <span class="profile-settings__label" data-i18n="auth.register.phone">Телефон</span>
                      <input class="profile-settings__input" name="phone" type="tel" autocomplete="tel" required>
                    </label>
                  </div>
                  <div class="profile-settings__actions">
                    <button class="profile-button" type="submit" data-i18n="profile.save">Сохранить</button>
                    <button class="profile-button profile-button--ghost" type="button" id="profile-logout" data-i18n="profile.logout">Выйти</button>
                  </div>
                </form>
              </section>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
