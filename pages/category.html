<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta data-i18n-page-title="page.categoryTitle">
  <title>Категория оборудования — Pascal Vent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/cta-form.css">
  <link rel="stylesheet" href="../css/category.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/footer.css">
</head>
<body data-page="category">
  <header class="header header--page">
    <div class="header__inner">
      <a href="index.html" class="header__logo" data-i18n-aria="header.logoAria" aria-label="Pascal Vent — главная">
        <picture>
          <source media="(max-width: 480px)" srcset="../assets/images/footer-mobile-logo.svg">
          <img src="../assets/icons/logo.svg" alt="Pascal Vent">
        </picture>
      </a>
      <nav class="header__nav" data-i18n-aria="header.navAria" aria-label="Основное меню">
        <ul class="nav__list">
          <li><a href="index.html#services" data-i18n="header.services">Услуги</a></li>
          <li><a href="index.html#about" data-i18n="header.about">О Нас</a></li>
          <li><a href="index.html#benefits" data-i18n="header.benefits">Польза Продукта</a></li>
          <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
          <li><a href="index.html#steps" data-i18n="header.steps">Этапы Работы</a></li>
          <li><a href="contacts.html" data-i18n="header.contacts">Контакты</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <div class="lang-switch" role="group" data-i18n-aria="header.langAria" aria-label="Выбор языка">
          <button type="button" class="lang-switch__btn" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" class="lang-switch__btn" data-lang="be" aria-pressed="false">BE</button>
          <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="header__profile" href="login.html" data-header-profile data-i18n-aria="header.profile" aria-label="Профиль">
          <svg class="header__profile-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 19.5c1.8-3.2 4.2-4.8 7-4.8s5.2 1.6 7 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </a>
        <button class="header__burger" type="button" data-i18n-aria="header.openMenu" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-nav">
          <span class="header__burger-line" aria-hidden="true"></span>
          <span class="header__burger-line" aria-hidden="true"></span>
          <span class="header__burger-line" aria-hidden="true"></span>
        </button>
        <button class="header__btn" type="button" data-modal="contact" data-i18n-aria="header.contact" aria-label="Связаться">
          <span class="header__btn-text" data-i18n="header.contact">Связаться</span>
        </button>
      </div>
    </div>
    <nav class="header__mobile-nav" id="mobile-nav" data-i18n-aria="header.mobileNavAria" aria-label="Мобильное меню" hidden>
      <ul class="header__mobile-list">
        <li><a href="index.html#services" data-i18n="header.services">Услуги</a></li>
        <li><a href="index.html#about" data-i18n="header.about">О Нас</a></li>
        <li><a href="index.html#benefits" data-i18n="header.benefits">Польза Продукта</a></li>
        <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
        <li><a href="contacts.html" data-i18n="header.contacts">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="category-page" aria-labelledby="page-title">
      <div class="category-page__inner">
        <nav class="category-page__breadcrumbs" data-i18n-aria="category.breadcrumbsAria" aria-label="Хлебные крошки">
          <a href="index.html" data-i18n="category.home">Главная</a>
          <span aria-hidden="true">/</span>
          <a href="catalog.html" data-i18n="header.catalog">Каталог</a>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-current"></span>
        </nav>
        <h1 class="category-page__title" id="page-title"></h1>
        <div class="category-page__layout">
          <aside class="category-page__sidebar" data-i18n-aria="catalog.filters" aria-label="Фильтры">
            <h2 class="category-page__filter-title" data-i18n="catalog.filters">Фильтры</h2>
            <form id="filters-form">
              <div class="category-page__field">
                <label class="category-page__label" for="search-input" data-i18n="category.searchLabel">Поиск</label>
                <input class="category-page__input" id="search-input" type="search" data-i18n-placeholder="category.searchPlaceholder" placeholder="Поиск по товарам">
              </div>
              <div class="category-page__generated-filters" id="generated-filters"></div>
              <div class="category-page__actions category-page__actions--bottom">
                <button class="category-page__button" type="submit" data-i18n="category.apply">Применить</button>
                <button class="category-page__button category-page__button--reset" id="reset-filters" type="button" data-i18n="category.reset">Сбросить</button>
              </div>
            </form>
          </aside>

          <section class="category-page__products" aria-labelledby="page-title">
            <div class="category-page__toolbar">
              <p class="category-page__count" id="products-count" aria-live="polite"></p>
              <label class="category-page__sort-wrap" for="sort-select">
                <span data-i18n="catalog.sort">Сортировка</span>
                <select class="category-page__sort" id="sort-select">
                  <option value="popular" data-i18n="catalog.sort.popular">По популярности</option>
                  <option value="price-asc" data-i18n="catalog.sort.priceAsc">Цена: по возрастанию</option>
                  <option value="price-desc" data-i18n="catalog.sort.priceDesc">Цена: по убыванию</option>
                  <option value="name" data-i18n="catalog.sort.name">По названию</option>
                </select>
              </label>
            </div>
            <div class="products-grid" id="products-grid" aria-live="polite"></div>
            <nav class="category-page__pagination" id="pagination" aria-label="Пагинация"></nav>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script type="module" src="../js/category.js"></script>
  <script type="module" src="../js/header.js"></script>
</body>
</html>
