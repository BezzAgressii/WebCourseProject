<!DOCTYPE html>
<html lang="ru" class="is-preload" data-theme="light">
<head>
  <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta data-i18n-page-title="page.categoryTitle">
  <title>Категория оборудования — Pascal Vent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <script src="../js/common/preloader.js"></script>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/cta-form.css">
  <link rel="stylesheet" href="../css/category.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body data-page="category">
  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <img class="preloader__logo" src="../assets/icons/logo.svg" alt="Pascal Vent" width="196" height="61">
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>
  <header class="header header--page">
    <div class="header__inner">
      <a href="../index.html" class="header__logo" data-i18n-aria="header.logoAria" aria-label="Pascal Vent — главная">
        <picture>
          <source media="(max-width: 480px)" srcset="../assets/images/footer-mobile-logo.svg">
          <img src="../assets/icons/logo.svg" alt="Pascal Vent">
        </picture>
      </a>
      <nav class="header__nav" data-i18n-aria="header.navAria" aria-label="Основное меню">
        <ul class="nav__list">
          <li><a href="../index.html#services" data-i18n="header.services">Услуги</a></li>
          <li><a href="../index.html#about" data-i18n="header.about">О Нас</a></li>
          <li><a href="../index.html#benefits" data-i18n="header.benefits">Польза Продукта</a></li>
          <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
          <li><a href="../index.html#steps" data-i18n="header.steps">Этапы Работы</a></li>
          <li><a href="contacts.html" data-i18n="header.contacts">Контакты</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <div class="header-settings">
          <button
            type="button"
            class="header-settings__toggle"
            aria-expanded="false"
            aria-controls="header-settings-panel"
            data-i18n-aria="header.settingsAria"
            aria-label="Настройки"
            title="Настройки"
          >
            <svg class="header-settings__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.4-1.04-.71-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.58.23-1.12.54-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.4 1.04.71 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.58-.23 1.12-.54 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
            </svg>
          </button>
          <div class="header-settings__panel" id="header-settings-panel" hidden>
            <div class="header-settings__group">
              <p class="header-settings__label" data-i18n="header.languageLabel">Язык</p>
              <div class="lang-switch" role="group" data-i18n-aria="header.langAria" aria-label="Выбор языка">
                <button type="button" class="lang-switch__btn" data-lang="ru" aria-pressed="true">RU</button>
                <button type="button" class="lang-switch__btn" data-lang="be" aria-pressed="false">BE</button>
                <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">EN</button>
              </div>
            </div>
            <div class="header-settings__group">
              <p class="header-settings__label" data-i18n="header.themeLabel">Тема</p>
              <div class="theme-switch" role="group" data-i18n-aria="header.themeAria" aria-label="Тема оформления">
                <button type="button" class="theme-switch__btn" data-theme-toggle="light" aria-pressed="false" aria-label="Светлая тема" title="Светлая">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.5 12H2M22 12h-2.5M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="theme-switch__btn" data-theme-toggle="dark" aria-pressed="false" aria-label="Тёмная тема" title="Тёмная">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <a class="header__profile" href="login.html" data-header-profile data-i18n-aria="header.profile" aria-label="Профиль">
          <svg class="header__profile-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 19.5c1.8-3.2 4.2-4.8 7-4.8s5.2 1.6 7 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </a>
        <button class="header__burger" type="button" data-i18n-aria="header.openMenu" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-nav">
          <span class="header__burger-line" aria-hidden="true"></span>
          <span class="header__burger-line" aria-hidden="true"></span>
          <span class="header__burger-line" aria-hidden="true"></span>
        </button>
        <button class="header__btn" type="button" data-modal="contact" data-i18n-aria="header.contact" aria-label="Связаться">
          <span class="header__btn-text" data-i18n="header.contact">Связаться</span>
        </button>
      </div>
    </div>
    <nav class="header__mobile-nav" id="mobile-nav" data-i18n-aria="header.mobileNavAria" aria-label="Мобильное меню" hidden>
      <ul class="header__mobile-list">
        <li><a href="../index.html#services" data-i18n="header.services">Услуги</a></li>
        <li><a href="../index.html#about" data-i18n="header.about">О Нас</a></li>
        <li><a href="../index.html#benefits" data-i18n="header.benefits">Польза Продукта</a></li>
        <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
        <li><a href="contacts.html" data-i18n="header.contacts">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="category-page" aria-labelledby="page-title">
      <div class="category-page__inner">
        <nav class="category-page__breadcrumbs" data-i18n-aria="category.breadcrumbsAria" aria-label="Хлебные крошки">
          <a href="../index.html" data-i18n="category.home">Главная</a>
          <span aria-hidden="true">/</span>
          <a href="catalog.html" data-i18n="header.catalog">Каталог</a>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-current"></span>
        </nav>
        <h1 class="category-page__title" id="page-title"></h1>
        <div class="category-page__layout">
          <div class="category-mobile-bar" data-category-mobile-bar>
            <button class="category-mobile-bar__btn" type="button" data-mobile-filters-open>
              <svg class="category-mobile-bar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <span data-i18n="catalog.filters">Фильтры</span>
            </button>
            <button class="category-mobile-bar__btn" type="button" data-mobile-sort-open>
              <svg class="category-mobile-bar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 6v12M7 18l-2.5-2.5M7 18l2.5-2.5M17 18V6M17 6l-2.5 2.5M17 6l2.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span data-i18n="catalog.sort">Сортировка</span>
            </button>
          </div>

          <div class="category-mobile-overlay" data-mobile-overlay hidden></div>

          <aside class="category-page__sidebar" data-mobile-filters-panel data-i18n-aria="catalog.filters" aria-label="Фильтры">
            <div class="category-page__filter-header">
              <h2 class="category-page__filter-title" data-i18n="catalog.filters">Фильтры</h2>
              <button class="category-mobile-close" type="button" data-mobile-filters-close data-i18n-aria="category.closeFilters" aria-label="Закрыть фильтры">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <form id="filters-form">
              <div class="category-page__field">
                <label class="category-page__label" for="search-input" data-i18n="category.searchLabel">Поиск</label>
                <input class="category-page__input" id="search-input" type="search" data-i18n-placeholder="category.searchPlaceholder" placeholder="Поиск по товарам">
              </div>
              <div class="category-page__generated-filters" id="generated-filters"></div>
              <div class="category-page__actions category-page__actions--bottom">
                <button class="category-page__button" type="submit" data-i18n="category.apply">Применить</button>
                <button class="category-page__button category-page__button--reset" id="reset-filters" type="button" data-i18n="category.reset">Сбросить</button>
              </div>
            </form>
          </aside>

          <div class="category-mobile-sheet" data-mobile-sort-sheet hidden>
            <div class="category-mobile-sheet__header">
              <h2 class="category-mobile-sheet__title" data-i18n="catalog.sort">Сортировка</h2>
              <button class="category-mobile-close" type="button" data-mobile-sort-close data-i18n-aria="category.closeSort" aria-label="Закрыть сортировку">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <div class="category-mobile-sheet__options" data-mobile-sort-options role="listbox" data-i18n-aria="catalog.sort" aria-label="Сортировка"></div>
          </div>

          <section class="category-page__products" aria-labelledby="page-title">
            <div class="category-page__toolbar">
              <p class="category-page__count" id="products-count" aria-live="polite"></p>
              <label class="category-page__sort-wrap" for="sort-select">
                <span data-i18n="catalog.sort">Сортировка</span>
                <select class="category-page__sort" id="sort-select">
                  <option value="popular" data-i18n="catalog.sort.popular">По популярности</option>
                  <option value="price-asc" data-i18n="catalog.sort.priceAsc">Цена: по возрастанию</option>
                  <option value="price-desc" data-i18n="catalog.sort.priceDesc">Цена: по убыванию</option>
                  <option value="name" data-i18n="catalog.sort.name">По названию</option>
                </select>
              </label>
            </div>
            <div class="products-grid" id="products-grid" aria-live="polite"></div>
            <nav class="category-page__pagination" id="pagination" aria-label="Пагинация"></nav>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/category.js"></script>
</body>
</html>
