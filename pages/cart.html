  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — Pascal Vent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <script src="../js/common/preloader.js"></script>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/footer.css">

</head>
<body data-page="cart">
  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <img class="preloader__logo" src="../assets/icons/logo.svg" alt="Pascal Vent" width="196" height="61">
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>
  <header class="header header--page">
    <div class="header__inner">
      <a href="../index.html" class="header__logo" data-i18n-aria="header.logoAria" aria-label="Pascal Vent — главная">
        <picture>
          <source media="(max-width: 480px)" srcset="../assets/images/footer-mobile-logo.svg">
          <img src="../assets/icons/logo.svg" alt="Pascal Vent">
        </picture>
      </a>
      <nav class="header__nav" data-i18n-aria="header.navAria" aria-label="Основное меню">
        <ul class="nav__list">
          <li><a href="../index.html#services" data-i18n="header.services">Услуги</a></li>
          <li><a href="contacts.html" data-i18n="header.about">О Нас</a></li>
          <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
          <li><a href="cart.html" data-i18n="header.cart">Корзина</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <div class="header-settings">
          <button
            type="button"
            class="header-settings__toggle"
            aria-expanded="false"
            aria-controls="header-settings-panel"
            data-i18n-aria="header.settingsAria"
            aria-label="Настройки"
            title="Настройки"
          >
            <svg class="header-settings__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">

            </svg>
          </button>
          <div class="header-settings__panel" id="header-settings-panel" hidden>
            <div class="header-settings__group">
              <p class="header-settings__label" data-i18n="header.languageLabel">Язык</p>
              <div class="lang-switch" role="group" data-i18n-aria="header.langAria" aria-label="Выбор языка">
                <button type="button" class="lang-switch__btn" data-lang="ru" aria-pressed="true">RU</button>
                <button type="button" class="lang-switch__btn" data-lang="be" aria-pressed="false">BE</button>
                <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">EN</button>
              </div>
            </div>
            <div class="header-settings__group">
              <p class="header-settings__label" data-i18n="header.themeLabel">Тема</p>
              <div class="theme-switch" role="group" data-i18n-aria="header.themeAria" aria-label="Тема оформления">

                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>

              </div>
            </div>
            <div class="header-settings__group">
              <p class="header-settings__label" data-i18n="header.a11yLabel">Доступность</p>
              <button type="button" class="a11y-toggle" data-a11y-toggle aria-pressed="false">
                <span data-i18n="header.a11yEnable">Версия для слабовидящих</span>
              </button>
            </div>
            <div class="header-settings__group" data-accessibility-panel hidden>
              <p class="header-settings__label" data-i18n="header.a11ySchemeLabel">Цветовая схема</p>
              <div class="a11y-schemes" role="group" aria-label="Цветовая схема">
                <button type="button" class="a11y-schemes__btn" data-a11y-scheme="black-yellow" data-i18n-aria="header.a11yScheme.black-yellow" aria-label="Чёрный / жёлтый" title="Чёрный / жёлтый"></button>
                <button type="button" class="a11y-schemes__btn" data-a11y-scheme="black-white" data-i18n-aria="header.a11yScheme.black-white" aria-label="Чёрный / белый" title="Чёрный / белый"></button>
                <button type="button" class="a11y-schemes__btn" data-a11y-scheme="white-black" data-i18n-aria="header.a11yScheme.white-black" aria-label="Белый / чёрный" title="Белый / чёрный"></button>
                <button type="button" class="a11y-schemes__btn" data-a11y-scheme="blue-yellow" data-i18n-aria="header.a11yScheme.blue-yellow" aria-label="Синий / жёлтый" title="Синий / жёлтый"></button>
              </div>
              <p class="header-settings__label" data-i18n="header.a11yFontLabel">Размер шрифта</p>
              <div class="a11y-fonts" role="group" aria-label="Размер шрифта">
                <button type="button" class="a11y-fonts__btn" data-font-size="normal" data-i18n-aria="header.a11yFont.normal" aria-label="Обычный" title="Обычный">A</button>

          </svg>
        </a>
        <button class="header__burger" type="button" data-i18n-aria="header.openMenu" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-nav">

          <span class="header__burger-line" aria-hidden="true"></span>
          <span class="header__burger-line" aria-hidden="true"></span>
        </button>
        <button class="header__btn" type="button" data-modal="contact" data-i18n-aria="header.contact" aria-label="Связаться">
          <span class="header__btn-text" data-i18n="header.contact">Связаться</span>
        </button>
      </div>
    </div>
    <nav class="header__mobile-nav" id="mobile-nav" data-i18n-aria="header.mobileNavAria" aria-label="Мобильное меню" hidden>
      <ul class="header__mobile-list">
        <li><a href="catalog.html" data-i18n="header.catalog">Каталог</a></li>
        <li><a href="cart.html" data-i18n="header.cart">Корзина</a></li>
        <li><a href="profile.html" data-i18n="header.profile">Профиль</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="account-page" aria-labelledby="cart-title">
      <div class="account-page__inner">
        <nav class="account-page__breadcrumbs" aria-label="Хлебные крошки">
          <a href="../index.html" data-i18n="category.home">Главная</a>
          <span aria-hidden="true">/</span>
          <a href="catalog.html" data-i18n="header.catalog">Каталог</a>
          <span aria-hidden="true">/</span>
          <span data-i18n="header.cart">Корзина</span>

        <h1 class="account-page__title" id="cart-title" data-i18n="cart.title">Корзина</h1>

        <div class="cart-layout">
          <div class="cart-list" id="cart-list" hidden></div>

            <button class="cart-summary__button" type="button" id="cart-order" data-i18n="cart.order">Заказать</button>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script type="module" src="../js/main.js"></script>
